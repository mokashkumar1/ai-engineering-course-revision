[project]
name = "ai-engineering-course-revision"
version = "0.1.0"
description = "Multilingual AI Engineering course revision assistant with modern dark chat UI, Groq RAG, Qdrant vectors, and synchronized YouTube lecture playback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.25.0",
    "sentencepiece>=0.2.0",
]

[tool.uv]
package = false
