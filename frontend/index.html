<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1923"><meta name="description" content="Ask a question in Hinglish or English. Revisit the explanation from AI Engineering lectures.">
<title>AI Engineering Course Revision</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%230f1923'/%3E%3Cpath d='M16 11l14 9-14 9z' fill='%2355b87a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/styles.css?v=dark-chat-1">
<script src="/assets/app.js?v=dark-chat-1" defer></script>
</head>
<body>
<!-- Header -->
<header id="app-header">
  <div class="header-left">
    <a class="brand" href="/" aria-label="AI Engineering Course Revision home">
      <span class="brand-icon" aria-hidden="true">▶</span>
      <span class="brand-text">AI Engineering Course Revision</span>
    </a>
  </div>
  <div class="header-right">
    <button type="button" id="history-btn" class="header-link" aria-label="View search history">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      History
    </button>
  </div>
</header>

<!-- Main Layout -->
<main id="main">
  <!-- Left Column: Chat -->
  <section class="chat-column" aria-label="Search and answers">
    <div class="chat-header">
      <h1 id="page-title">Lecture Search</h1>
      <p class="subtitle">Ask in Hinglish or English. Answers come only from what was actually said in the lectures.</p>
    </div>
    <div id="chat-messages" class="chat-messages" aria-live="polite">
      <div class="chat-placeholder">
        <p>Ask something to get started.</p>
      </div>
    </div>
    <form id="search-form" class="chat-input-bar">
      <label class="sr-only" for="question">Your question</label>
      <input id="question" type="search" autocomplete="off" maxlength="500" required minlength="2" placeholder="Type your question here...">
      <button id="submit" type="submit" aria-label="Ask">Ask</button>
    </form>
  </section>

  <!-- Right Column: Player -->
  <aside class="player-column" aria-label="Video player">
    <div class="player-wrapper">
      <div class="video-stage">
        <div id="youtube-player"></div>
        <div id="player-placeholder" class="player-placeholder-overlay">
          <img id="video-thumbnail" alt="" hidden>
          <button id="poster-play" type="button" aria-label="Play selected explanation" hidden>
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="24" fill="rgba(255,255,255,0.15)"/><path d="M19 15l14 9-14 9z" fill="#fff"/></svg>
          </button>
          <div id="no-video-msg" class="no-video-message">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/><line x1="17" y1="17" x2="22" y2="17"/></svg>
            <span>No lecture loaded.</span>
          </div>
        </div>
      </div>
      <div id="player-info" class="player-info" hidden>
        <div class="player-info-top">
          <h2 id="player-title"></h2>
          <button type="button" id="close-player" aria-label="Close video" title="Close video">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <p id="player-note" class="player-note"></p>
        <a id="youtube-link" class="youtube-link" target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Open on YouTube
        </a>
      </div>
    </div>
  </aside>
</main>

<!-- History Panel (hidden by default) -->
<div id="history-panel" class="history-panel" hidden>
  <div class="history-backdrop"></div>
  <div class="history-drawer">
    <div class="history-header">
      <h2>Search History</h2>
      <button type="button" id="close-history" aria-label="Close history">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="history-list" class="history-list">
      <p class="history-empty">No search history yet.</p>
    </div>
  </div>
</div>

</body></html>
